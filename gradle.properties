#Gradle (heap sized for Kotlin/Native XCFramework link; reduce if not building iOS)
org.gradle.jvmargs=-Xmx8192M -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8192M"
org.gradle.caching=true
# Disabled: generate*Base64 tasks use project.file() and break config cache
org.gradle.configuration-cache=false
# Fewer workers = less peak memory when linking iOS frameworks in parallel
org.gradle.workers.max=2

#Kotlin
kotlin.code.style=official
# Custom iosMain + dependsOn; disable default hierarchy template so our explicit edges are accepted.
kotlin.mpp.applyDefaultHierarchyTemplate=false

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true