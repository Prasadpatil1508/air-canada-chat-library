name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: macos-latest

    env:
      GRADLE_OPTS: "-Xmx4g"
      ORG_GRADLE_PROJECT_kotlin.native.ignoreDisabledTargets: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if release already exists
        id: check_release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG)
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        if: steps.check_release.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Inject Connect config for remote library build
        if: steps.check_release.outputs.exists == 'false'
        run: |
          echo "API_GATEWAY=${{ secrets.API_GATEWAY }}" >> local.properties
          echo "CONTACT_FLOW_ID=${{ secrets.CONTACT_FLOW_ID }}" >> local.properties
          echo "INSTANCE_ID=${{ secrets.INSTANCE_ID }}" >> local.properties
          echo "REGION=${{ secrets.REGION }}" >> local.properties

      - name: Publish Android library to GitHub Packages
        if: steps.check_release.outputs.exists == 'false'
        run: |
          chmod +x gradlew
          VERSION="${GITHUB_REF#refs/tags/v}"
          ./gradlew clean \
            :shared:generateConnectConfig \
            :shared:publishAndroidPublicationToGitHubPackagesRepository \
            -PLIB_VERSION="$VERSION" \
            --no-daemon \
            --no-configuration-cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble XCFramework
        if: steps.check_release.outputs.exists == 'false'
        run: |
          ./gradlew :shared:assembleSharedReleaseXCFramework \
            --no-daemon \
            --no-configuration-cache

      - name: Commit XCFramework to repo (path-based SPM for private repo)
        if: steps.check_release.outputs.exists == 'false'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # Remove old framework and replace with newly built one
          rm -rf ChatSDK.xcframework
          cp -R shared/build/XCFrameworks/release/ChatSDK.xcframework ChatSDK.xcframework

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ChatSDK.xcframework
          git commit -m "Update ChatSDK.xcframework to ${TAG} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:refs/heads/main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (for changelog and Android assets)
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move tag to latest commit (so tag points to commit with updated XCFramework)
        if: steps.check_release.outputs.exists == 'false'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -d "${TAG}"
          git push origin ":refs/tags/${TAG}"
          git tag "${TAG}"
          git push origin "${TAG}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
